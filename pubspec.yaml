name: ceo_os
description: "CEO OS — AI Productivity Mentor"
publish_to: 'none'
version: 1.0.0+18

environment:
  sdk: ^3.11.0
  flutter: ^3.41.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.8.1
  provider: ^6.1.2
  google_fonts: ^6.2.1
  flutter_local_notifications: ^18.0.1
  home_widget: ^0.7.0
  image_picker: ^1.1.2
  path: ^1.9.0
  path_provider: ^2.1.5
  uuid: ^4.5.1
  intl: ^0.19.0
  fl_chart: ^0.70.2
  shared_preferences: ^2.3.4
  adaptive_platform_ui: ^0.1.101
  app_links: any
  supabase_flutter: ^2.12.0
  table_calendar: ^3.1.3
  google_sign_in: ^6.2.1
  workmanager: ^0.9.0+3
  icons_launcher: ^3.0.3
  purchases_flutter: ^9.3.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

icons_launcher:
  image_path: "assets/logo.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true
    macos:
      enable: true
    web:
      enable: true
    windows:
      enable: true

dependency_overrides:
  adaptive_platform_ui:
    path: ./packages/adaptive_platform_ui


flutter:
  uses-material-design: true
  assets:
    - assets/ranks/awakened/
    - assets/ranks/bronze/
    - assets/ranks/diamond/
    - assets/ranks/gold/
    - assets/ranks/immortal/
    - assets/ranks/platinum/
    - assets/ranks/silver/
    - assets/ranks/sleeping/
